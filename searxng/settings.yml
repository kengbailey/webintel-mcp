# SearxNG Settings for WebIntel MCP
# This is the default configuration for the bundled SearxNG instance.
# For full options, see: https://docs.searxng.org/admin/settings/index.html
#
# Engine selection is tuned for BOTH deployment scenarios (see README):
#   - LAN:  outbound scraping egresses via a commercial VPN exit (gluetun)
#   - GCP:  outbound scraping egresses via a datacenter IP
# Both exit-IP classes get bot-checked by major engines, but by DIFFERENT
# ones, so we enable the union of engines that work in at least one
# environment and rely on SearxNG's automatic engine suspension to silence
# whichever are blocked in the current one. Verified empirically 2026-08.

use_default_settings: true

server:
  bind_address: "0.0.0.0"
  secret_key: "change-me-to-a-random-string"
  port: 8080
  limiter: false  # Internal service, no public exposure

search:
  safe_search: 0
  formats:
    - html
    - json  # Required for API access by WebIntel MCP

engines:
  # NOTE: there is deliberately no plain "google" engine here. Google stopped
  # serving non-JS results in 2025 and SearxNG removed the scraping engine.
  # Google-backed results come from the default-enabled "google cse"
  # (Programmable Search) engine instead — it currently ships with a shared
  # community key. For quota safety, register a personal PSE id + API key and
  # configure them on the "google cse" engine here.

  - name: bing
    disabled: false   # works from datacenter (few results)

  - name: brave
    disabled: false   # works from datacenter, intermittent rate-limits

  - name: mwmbl
    disabled: false   # independent nonprofit index; works from datacenter

  - name: yep
    disabled: false   # denied from datacenter; works via VPN exit

  - name: mojeek
    disabled: false   # denied from datacenter; VPN-side candidate

  # Blocked (CAPTCHA / denial / timeout) from BOTH exit-IP classes —
  # disabled outright to avoid per-query latency before auto-suspension.
  - name: duckduckgo
    disabled: true

  - name: startpage
    disabled: true

  - name: qwant
    disabled: true

  - name: presearch
    disabled: true
