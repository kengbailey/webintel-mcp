# Cloud (GCP VM) deployment for WebIntel MCP.
#
# Differences vs the bundled docker-compose.yml:
#   - No Gluetun VPN / --profile vpn: every tool egresses directly through the
#     VM's datacenter IP (Reddit is direct by design; SearxNG scraping is
#     direct too -- accept occasional search-engine rate limiting on a
#     datacenter IP, or swap SearxNG to API-backed engines later).
#   - OAuth 2.1 (WorkOS AuthKit) + HMAC-JWT auth via env vars
#     (see src/server/auth.py).
#   - webintel-mcp binds 127.0.0.1 only; cloudflared is the sole public ingress.
#
# Ingress: create a Cloudflare Tunnel in the Zero Trust dashboard, point its
# public hostname (e.g. https://mcp.example.com) at http://webintel-mcp:3090,
# and put the tunnel token in CLOUDFLARE_TUNNEL_TOKEN. (Remote-managed tunnel;
# no local config.yml needed. For file-based config, mount cloudflared/config.yml
# instead and drop the token.)
#
# Usage:
#   cp .env.example .env        # fill in MCP_*, REDDIT_*, STT_*, CLOUDFLARE_TUNNEL_TOKEN
#   docker compose -f docker-compose.cloud.yml up -d --build
services:
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    volumes:
      - ./searxng:/etc/searxng:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  webintel-mcp:
    build: .
    image: webintel-mcp:latest
    container_name: webintel-mcp
    ports:
      - "127.0.0.1:3090:3090"   # localhost only; cloudflared reaches it over the compose network
    environment:
      - SEARXNG_HOST=http://searxng:8080
      - STT_ENDPOINT
      - STT_MODEL
      - STT_API_KEY
      - REDDIT_CLIENT_ID
      - REDDIT_CLIENT_SECRET
      - REDDIT_USER_AGENT
      - MCP_TRANSPORT=http
      # Cloud auth (see src/server/auth.py). Leave empty to disable auth.
      - MCP_AUTHKIT_DOMAIN
      - MCP_BASE_URL
      - MCP_RESOURCE_URL
      - MCP_REQUIRED_SCOPES
      - MCP_MACHINE_SECRET
      - MCP_MACHINE_ISSUER
    depends_on:
      searxng:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: webintel-mcp-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - webintel-mcp
