# V2 defaults. Existing proxy services can remain during migration.
services:
  gluetun:
    profiles: ["vpn"]
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER
      - VPN_TYPE
      - OPENVPN_CUSTOM_CONFIG=/gluetun/custom/config.ovpn
      - OPENVPN_USER
      - OPENVPN_PASSWORD
      - HTTPPROXY=on
    volumes:
      - ./gluetun:/gluetun
    ports:
      - "8888:8888"
    restart: unless-stopped


  webintel-mcp:
    build: .
    image: ${WEBINTEL_IMAGE:-webintel-mcp:latest}
    container_name: webintel-mcp
    ports:
      - "${MCP_BIND_ADDRESS:-0.0.0.0}:${MCP_HOST_PORT:-3090}:3090"
    env_file:
      - path: ${WEBINTEL_ENV_FILE:-./runtime.env}
        format: raw
    restart: unless-stopped
