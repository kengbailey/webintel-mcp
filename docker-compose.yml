services:
  # Bundled SearxNG instance — provides search API for WebIntel MCP
  # When using --profile vpn, SearxNG shares Gluetun's network stack
  # so all its outbound requests route through the VPN.
  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: searxng
    volumes:
      - ./searxng:/etc/searxng:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Gluetun VPN container — only starts with --profile vpn
  # Usage: docker compose --profile vpn up -d
  # When active, SearxNG attaches to Gluetun's network (see searxng-vpn)
  # and its port 8080 is exposed through Gluetun.
  gluetun:
    profiles: ["vpn"]
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER
      - VPN_TYPE
      - OPENVPN_CUSTOM_CONFIG=/gluetun/custom/config.ovpn
      - OPENVPN_USER
      - OPENVPN_PASSWORD
      - HTTPPROXY=on
    volumes:
      - ./gluetun:/gluetun
    ports:
      - "8888:8888"
      - "8080:8080"  # SearxNG (exposed here when using VPN profile)
    restart: unless-stopped

  # SearxNG routed through VPN — replaces standalone searxng when using --profile vpn
  searxng-vpn:
    profiles: ["vpn"]
    image: docker.io/searxng/searxng:latest
    container_name: searxng-vpn
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    volumes:
      - ./searxng:/etc/searxng:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  webintel-mcp:
    build: .
    image: webintel-mcp:latest
    container_name: webintel-mcp
    ports:
      - "3090:3090"
    environment:
      - SEARXNG_HOST=${SEARXNG_HOST:-http://searxng:8080}
      - STT_ENDPOINT
      - STT_MODEL
      - STT_API_KEY
      - PROXY_URL
      # YouTube egress: empty = direct residential (bypasses VPN; see config.py)
      - YOUTUBE_PROXY_URL=${YOUTUBE_PROXY_URL:-}
      - REDDIT_CLIENT_ID
      - REDDIT_CLIENT_SECRET
      - REDDIT_USER_AGENT
      - REDDIT_PROXY_URL
      # Transport options: http (default) or sse
      - MCP_TRANSPORT=${MCP_TRANSPORT:-http}
      # Optional: override port (default: 3090)
      # - MCP_PORT=3090
    depends_on:
      searxng:
        condition: service_healthy
    restart: unless-stopped
